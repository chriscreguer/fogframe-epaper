# fogframe configuration — copy to config.toml and edit.
#   cp config.example.toml config.toml
# config.toml is gitignored, so your location never gets committed.

[map]
# Bounding box to render, in decimal degrees. Pick this carefully: it is baked
# into assets/map_base.png. The box is automatically expanded to match the
# canvas aspect ratio, so it does not need to be 3:4 itself.
# Default is Manhattan — a placeholder so the example runs. Replace it.
north =  40.800
south =  40.700
west  = -74.020
east  = -73.960

[canvas]
# Must match your panel. 13.3" Spectra-6 (T133A01) is 1200x1600 portrait.
width  = 1200
height = 1600

[basemap]
# XYZ raster tiles used by make_base_map.py to bake assets/map_base.png.
# Any {z}/{x}/{y} raster source works. Check the provider's usage policy —
# this fetches a few hundred tiles once, which is fine for most, but do not
# point it at a source that forbids bulk access.
tile_url    = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
attribution = "(c) OpenStreetMap contributors"
# Tile zoom. 0 = pick automatically (one level above 1:1, then downsample).
zoom = 0
# Contact address sent in User-Agent. OSM requires a real one.
user_agent = "fogframe/1.0 (https://github.com/YOURNAME/fogframe-epaper)"

[colors]
fog            = [70, 70, 70]      # unexplored overlay, neutral grey
fog_opacity    = 0.62
recent         = [210, 35, 35]     # newly explored tint
water          = [64, 110, 180]    # water you have not travelled
water_explored = [255, 255, 255]   # water you have (boat/kayak/ice)
# Parkland you have walked. Must land in the packer's green hue band (PIL
# 45-80) or it will not survive quantisation — the panel's own palette green
# is hue 93 and comes out BLACK.
park           = [120, 170, 80]

[water]
# Water is found in the base map by hue, in PIL's 0-255 HSV space. These
# defaults match the OSM Carto style. make_base_map.py prints the dominant
# hues it saw — use that to retune for a different tile style.
hue_lo  = 100
hue_hi  = 138
sat_min = 40

[park]
# Parkland is found by hue, exactly like water, so it is tile-style dependent.
# OSM Carto's park green sits near hue 88; Mapbox's is nearer 60. Widen or move
# this band if parks come out grey. make_base_map.py reports the hues it saw.
hue_lo  = 45
hue_hi  = 95
sat_min = 25
# Footways and drives inside a park are not park-coloured, so the hue mask has
# thin gaps running through it exactly where you walk — which render as white
# streaks along your paths. Closing over this many pixels bridges them. Set to
# 0 to disable if it bleeds green onto streets beside your parks.
close   = 9

[render]
recent_days    = 30   # how long new exploration stays tinted
# Drain colour from unexplored ground. With this off, parkland is green whether
# or not you have been there, so green means "park"; with it on, green means
# "park you have walked" and unexplored parks fall back to plain fog grey.
chroma_when_explored = true
fringe_px      = 3    # ignore new pixels within N px of old territory (GPS jitter)
min_cluster_px = 4    # ignore new clusters smaller than this

[panel]
sat_boost     = 2.4   # amplify muted base-map colour before 6-colour quantising
# Fog desaturates whatever it covers, so unexplored parkland lands well below
# the saturation of the raw base map. 0.32 keeps parks green under fog with the
# OSM Carto defaults above; raise it toward 0.40 for a more neutral frame.
sat_threshold = 0.32  # below this saturation -> neutral black/white
# Unexplored ground sits in a narrow band of mid grey. Dithering that band
# normally yields a checkerboard plus a sparse 8 px lattice of extra white
# pixels, which reads as a grid of bright dots. Snapping the band to a flat
# checkerboard removes the grid and keeps the even tone. Defaults suit
# fog_opacity = 0.62; check where your own fog lands before changing them.
flat_lo = 0.40
flat_hi = 0.62

[source]
# "local"   — read a folder containing a Sync/ directory
# "dropbox" — pull it, using DROPBOX_* env vars (see README)
kind = "local"
path = "~/Fog of World"
dropbox_folder = "/Apps/Fog of World"
